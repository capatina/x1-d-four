# Xone:4D MIDI controls -> names used in mappings.toml.
#
# Source: Allen & Heath Xone:4D User Guide AP7265 iss. 3, pp. 38-41 ("Map 2",
# the Ableton default, chosen in the mixer's power-on setup). The mixer sends on
# `base_channel`; the shift layer sends the same messages one channel lower and
# those resolve to the same names prefixed with "shift.".
#
# kind: button (note on/off), absolute (CC 0-127), relative (CC two's complement:
#       1 = +1, 127 = -1). led = true marks red rings the host can toggle.
# Jog-switch directions are read off the guide's diagram and still unconfirmed.

base_channel = 16

