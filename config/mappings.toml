# X1 D. Four mappings: Xone:4D control (names in controls.toml) -> action.
# Saving this file applies it immediately; GET /api/mappings shows any error.
#
# Actions (deck = 1-4; leave it out to act on the focused deck):
#   deck.play_pause, deck.play, deck.pause   on press
#   deck.cue                                 press and release (CDJ-style cue)
#   deck.load_selected                       on press: load the library selection
#   deck.eject, deck.rate_reset              on press
#   deck.sync                                on press: beat sync on/off (locks to the master deck)
#   deck.loop                                on press: loop from the nearest beat (8 bars by default), press again to leave
#   deck.loop_length                         encoder: halve/double the loop (1/8 bar .. 32 bars), live while looping
#   deck.jog       jog/encoder: jump through the track at once; amount = ms per tick when turning
#                  slowly (default 5), spinning faster jumps further per tick (up to 300x).
#                  A synced, playing deck moves in whole beats so it stays on the master's beat
#   deck.shift     jog/encoder: smooth nudge to fix a sync that's off, amount = ms per tick
#                  (default 2); playing = speed bend, paused = glide; a synced deck keeps the new
#                  offset against the master
#   deck.focus                               on press (needs deck)
#   deck.focus_step                          encoder: move the focus one deck per click (1-4); the tunnel grows from the focused deck
#   deck.nudge     amount = seconds per press or per encoder step (default 0.01)
#   deck.rate      encoder: amount per step (default 0.0005 = 0.05 %)
#                  pot/fader: +/- range around 1.0 (default 0.08 = 8 %)
#                  button: amount per press (default 0.01)
#   deck.trim      pot/fader: 0..2x gain; encoder: amount per step (default 0.02)
#   library.scroll encoder: rows per step; button: amount rows per press (default 1)
#
# Explore (the similarity tunnel):
#   explore.cycle_band   on press: low -> mid -> high
#   explore.band_fader   fader: bottom third low, middle mid, top third high
#   explore.band_crossfader  the Xone:4D crossfader (xfader): left low, middle mid, right high
#   explore.band_step    jog/encoder: turn right for the next band up, left for down;
#                        amount = ticks per band step (default 8), stops at low/high
#   explore.band         on press, amount = 0 (low), 1 (mid) or 2 (high)
#   explore.aim          encoder or jog: move between portals; button: amount portals per press
#   explore.dive         on press: fly into the aimed portal
#   explore.back         on press: climb back up
#   explore.step         encoder: turn right = dive, turn left = back
#   explore.follow       on press: toggle following the focused deck's track
#   explore.root         on press: start the tunnel at the library selection
#
# led (controls with led = true only): "deck.playing", "deck.loaded", "deck.focused", "deck.synced".
# The rings toggle on each message, so they need the mixer's host-driven ring mode
# (third illuminated button unlit in the power-on map setup).

# Everything is played from the mixer; the screen only shows it.
#
#                 LEFT POD                            RIGHT POD
# lit 1-4         load aimed track -> deck 1-4        play/pause deck 1-4
# jog             move through the focused deck       shift the focused deck to fix its sync
#                 (spin faster to go further)
# SELECT          turn: focus deck 1-4, push: fly     turn: aim between portals, push: dive
#                 the library selection
# buttons         A low, B mid, C high band,
#                 E follow the focused deck
# encoders 1-4    loop length, push = loop deck 1-4   skip deck 1-4 by 2 s, push = sync
# faders 1-4      pitch deck 1-4 (+/-8 %)
# crossfader      band: left low, middle mid, right high

# ---- Left pod ----
[[map]]
control = "left.lit1"
action = "deck.load_selected"
deck = 1
led = "deck.loaded"

[[map]]
control = "left.lit2"
action = "deck.load_selected"
deck = 2
led = "deck.loaded"

[[map]]
control = "left.lit3"
action = "deck.load_selected"
deck = 3
led = "deck.loaded"

[[map]]
control = "left.lit4"
action = "deck.load_selected"
deck = 4
led = "deck.loaded"

[[map]]
control = "left.jog"
action = "deck.jog"
amount = 5

# Crossfader: left = low, middle = mid, right = high band. It only sends MIDI with
# XFADE CURVE turned fully left.
[[map]]
control = "xfader"
action = "explore.band_crossfader"

[[map]]
control = "left.browse"
action = "deck.focus_step"

[[map]]
control = "left.browse.push"
action = "explore.root"

[[map]]
control = "left.button.A"
action = "explore.band"
amount = 0

[[map]]
control = "left.button.B"
action = "explore.band"
amount = 1

[[map]]
control = "left.button.C"
action = "explore.band"
amount = 2

[[map]]
control = "left.button.E"
action = "explore.follow"

[[map]]
control = "left.encoder1"
action = "deck.loop_length"
deck = 1

[[map]]
control = "left.encoder2"
action = "deck.loop_length"
deck = 2

[[map]]
control = "left.encoder3"
action = "deck.loop_length"
deck = 3

[[map]]
control = "left.encoder4"
action = "deck.loop_length"
deck = 4

[[map]]
control = "left.encoder1.push"
action = "deck.loop"
deck = 1

[[map]]
control = "left.encoder2.push"
action = "deck.loop"
deck = 2

[[map]]
control = "left.encoder3.push"
action = "deck.loop"
deck = 3

[[map]]
control = "left.encoder4.push"
action = "deck.loop"
deck = 4

[[map]]
control = "left.fader1"
action = "deck.rate"
deck = 1

[[map]]
control = "left.fader2"
action = "deck.rate"
deck = 2

[[map]]
control = "left.fader3"
action = "deck.rate"
deck = 3

[[map]]
control = "left.fader4"
action = "deck.rate"
deck = 4

# ---- Right pod ----
[[map]]
control = "right.lit1"
action = "deck.play_pause"
deck = 1
led = "deck.playing"

[[map]]
control = "right.lit2"
action = "deck.play_pause"
deck = 2
led = "deck.playing"

[[map]]
control = "right.lit3"
action = "deck.play_pause"
deck = 3
led = "deck.playing"

[[map]]
control = "right.lit4"
action = "deck.play_pause"
deck = 4
led = "deck.playing"

[[map]]
control = "right.jog"
action = "deck.shift"
amount = 2

[[map]]
control = "right.browse"
action = "explore.aim"

[[map]]
control = "right.browse.push"
action = "explore.dive"

[[map]]
control = "right.encoder1"
action = "deck.nudge"
deck = 1
amount = 2.0

[[map]]
control = "right.encoder2"
action = "deck.nudge"
deck = 2
amount = 2.0

[[map]]
control = "right.encoder3"
action = "deck.nudge"
deck = 3
amount = 2.0

[[map]]
control = "right.encoder4"
action = "deck.nudge"
deck = 4
amount = 2.0

[[map]]
control = "right.encoder1.push"
action = "deck.sync"
deck = 1

[[map]]
control = "right.encoder2.push"
action = "deck.sync"
deck = 2

[[map]]
control = "right.encoder3.push"
action = "deck.sync"
deck = 3

[[map]]
control = "right.encoder4.push"
action = "deck.sync"
deck = 4
